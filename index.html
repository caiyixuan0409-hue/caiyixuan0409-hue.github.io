<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>时间表</title>
<meta name="description" content="粉粉的时间表：添加任务，自动找空档，勾选完成。">
<!-- PWA / 添加到主屏幕 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="时间表">
<meta name="theme-color" content="#ffd6e0">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<style>
  :root{
    --pink:#ff8fab; --pink-deep:#ff6b9d; --pink-soft:#ffd6e0; --pink-line:#ffe0e8;
    --bg:#fff5f8; --card:#ffffff; --cream:#fffaf5; --ink:#5b3a3a; --muted:#a9818a;
    --shadow:0 8px 24px rgba(255,107,157,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); background:linear-gradient(180deg,#fff9fb 0%,#ffeef3 100%); min-height:100vh;
  }
  .wrap{max-width:720px; margin:0 auto; padding:18px 16px calc(96px + env(safe-area-inset-bottom));}
  header{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  h1{font-size:26px; margin:0; letter-spacing:1px;}
  h1 span{color:var(--pink-deep);}
  .icon-btn{
    border:1px solid var(--pink-line); background:#fff; color:var(--ink); border-radius:999px;
    padding:8px 14px; font-size:14px; cursor:pointer;
  }
  .weeknav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px;}
  .weeknav button{
    border:1px solid var(--pink-line); background:#fff; color:var(--ink); border-radius:999px;
    padding:8px 12px; font-size:14px; cursor:pointer;
  }
  .weeknav .label{font-weight:600; font-size:15px;}
  .datestrip{display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-bottom:16px;}
  .day{
    border:1px solid var(--pink-line); background:#fff; border-radius:16px; padding:8px 0 7px;
    text-align:center; cursor:pointer; font-size:12px; color:var(--muted);
  }
  .day b{display:block; font-size:17px; color:var(--ink); margin-top:2px;}
  .day.today{border-color:var(--pink);}
  .day.today::after{content:"今天"; display:block; font-size:10px; color:var(--pink-deep); margin-top:1px;}
  .day.sel{background:linear-gradient(180deg,#ffb3c6,#ff8fab); border-color:transparent; color:#fff;}
  .day.sel b{color:#fff;}
  .day.sel.today::after{color:#fff;}
  .summary{font-size:13px; color:var(--muted); margin:0 0 10px 2px;}
  .card{
    background:var(--card); border:1px solid var(--pink-line); border-radius:20px;
    padding:14px 14px; box-shadow:var(--shadow); margin-bottom:10px;
  }
  .task{display:flex; align-items:flex-start; gap:10px;}
  .task.done .t-title{text-decoration:line-through; color:var(--muted);}
  .chk{
    appearance:none; width:24px; height:24px; flex:0 0 24px; margin:1px 0 0; border-radius:50%;
    border:2px solid var(--pink-soft); background:#fff; cursor:pointer; position:relative;
  }
  .chk:checked{background:var(--pink-deep); border-color:var(--pink-deep);}
  .chk:checked::after{content:"✓"; position:absolute; inset:0; color:#fff; font-size:14px; text-align:center; line-height:20px;}
  .t-main{flex:1; min-width:0;}
  .t-title{font-size:16px; font-weight:600; word-break:break-all;}
  .t-meta{font-size:12px; color:var(--muted); margin-top:4px; display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .cat{border-radius:999px; padding:2px 9px; font-size:12px;}
  .cat-课程{background:#ffe3ec; color:#c24b72;}
  .cat-学习{background:#fff1d6; color:#a9761f;}
  .cat-工作{background:#e3f2ff; color:#3d7ab8;}
  .cat-运动{background:#e2f7e6; color:#3d8a55;}
  .cat-生活{background:#f1e6ff; color:#7a4fc0;}
  .cat-其他{background:#f2f2f2; color:#777;}
  .t-actions{display:flex; gap:6px; flex:0 0 auto;}
  .mini{border:1px solid var(--pink-line); background:#fff; border-radius:999px; padding:5px 10px; font-size:12px; cursor:pointer; color:var(--ink);}
  .mini.danger{border-color:#ffc9c9; color:#d05a5a;}
  .section-title{font-size:13px; color:var(--muted); margin:14px 2px 8px;}
  /* 空状态 + 吉祥物 */
  .empty{text-align:center; padding:10px 10px 22px;}
  .mascot-wrap{position:relative; width:190px; height:190px; margin:6px auto 4px; animation:floaty 3.4s ease-in-out infinite;}
  .mascot-wrap img{width:100%; height:100%; object-fit:contain; display:block;}
  .lid{
    position:absolute; background:#fff7f1; border-radius:50%; border-bottom:2px solid rgba(122,74,58,.55);
    transform-origin:top center; transform:scaleY(0); animation:blink 4.8s infinite;
  }
  .lid.left{left:30.5%; top:42%; width:15.5%; height:18%;}
  .lid.right{left:54%; top:42%; width:15.5%; height:18%;}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-1deg);}50%{transform:translateY(-8px) rotate(1deg);}}
  @keyframes blink{0%,92%,100%{transform:scaleY(0);}94%,96%{transform:scaleY(1);}}
  .empty p{margin:6px 0; color:var(--muted); font-size:14px;}
  .fab{
    position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom));
    border:none; background:linear-gradient(180deg,#ff9db4,#ff6b9d); color:#fff; font-size:16px; font-weight:600;
    padding:14px 26px; border-radius:999px; box-shadow:0 10px 24px rgba(255,107,157,.35); cursor:pointer; z-index:10;
  }
  /* 弹窗 */
  .overlay{position:fixed; inset:0; background:rgba(91,58,58,.35); display:none; align-items:flex-end; justify-content:center; z-index:20;}
  .overlay.open{display:flex;}
  .sheet{background:#fff; width:100%; max-width:720px; border-radius:22px 22px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;}
  .sheet h2{margin:0 0 14px; font-size:19px;}
  .field{margin-bottom:13px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .field input[type="text"], .field input[type="number"], .field input[type="time"], .field select{
    width:100%; border:1px solid var(--pink-line); border-radius:14px; padding:11px 12px; font-size:16px; color:var(--ink); background:#fff; outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--pink);}
  .chips{display:flex; gap:8px; flex-wrap:wrap;}
  .chip{border:1px solid var(--pink-line); background:#fff; border-radius:999px; padding:7px 13px; font-size:13px; cursor:pointer;}
  .chip.sel{background:var(--pink-deep); border-color:var(--pink-deep); color:#fff;}
  .radios{display:flex; gap:8px;}
  .radios label{flex:1; text-align:center; border:1px solid var(--pink-line); border-radius:14px; padding:10px 6px; font-size:14px; cursor:pointer;}
  .radios input{display:none;}
  .radios input:checked + span{font-weight:700; color:var(--pink-deep);}
  .radios label:has(input:checked){border-color:var(--pink-deep); background:#fff5f8;}
  .row{display:flex; gap:10px;}
  .row .field{flex:1;}
  .btn-primary{width:100%; border:none; background:linear-gradient(180deg,#ff9db4,#ff6b9d); color:#fff; font-size:16px; font-weight:600; padding:13px; border-radius:999px; cursor:pointer;}
  .btn-ghost{width:100%; border:1px solid var(--pink-line); background:#fff; color:var(--ink); font-size:15px; padding:11px; border-radius:999px; cursor:pointer; margin-top:9px;}
  .hint{font-size:12px; color:var(--muted); margin-top:6px;}
  .err{font-size:13px; color:#d05a5a; margin-top:8px; display:none;}
  .field textarea{
    width:100%; border:1px solid var(--pink-line); border-radius:14px; padding:11px 12px;
    font-size:15px; color:var(--ink); background:#fff; outline:none; resize:vertical; min-height:150px; line-height:1.7;
  }
  .field textarea:focus{border-color:var(--pink);}
  .batch-result{margin-top:4px;}
  .batch-result h3{font-size:15px; margin:14px 0 8px;}
  .batch-item{font-size:14px; padding:8px 10px; border-radius:12px; margin-bottom:6px; line-height:1.5;}
  .batch-item.ok{background:#e2f7e6; color:#2f6b45;}
  .batch-item.fail{background:#ffe9e9; color:#a33;}
  .actions{display:flex; gap:10px; margin:2px 0 14px;}
  .act-btn{
    flex:1; border:1px solid var(--pink-line); background:#fff; color:var(--ink);
    border-radius:16px; padding:12px 8px; font-size:15px; font-weight:600; cursor:pointer;
    box-shadow:var(--shadow);
  }
  .act-btn:active{background:#fff5f8;}
  .fixed-badge{background:var(--pink-deep); color:#fff; border-radius:999px; padding:2px 9px; font-size:12px;}
  .fixed-row{display:flex; align-items:center; gap:8px; background:var(--cream); border:1px solid var(--pink-line); border-radius:14px; padding:10px 12px; margin-bottom:8px; font-size:14px;}
  .fixed-row .fx-main{flex:1; min-width:0;}
  .fixed-row .fx-time{color:var(--muted); font-size:12px; margin-top:2px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>我的<span>时间表</span></h1>
    <button class="icon-btn" id="settingsBtn">⚙️ 排程设置</button>
  </header>

  <div class="weeknav">
    <button id="prevWeek">← 上一周</button>
    <span class="label" id="weekLabel"></span>
    <button id="todayBtn">回到今天</button>
    <button id="nextWeek">下一周 →</button>
  </div>

  <div class="datestrip" id="dateStrip"></div>
  <p class="summary" id="summary"></p>
  <div class="actions">
    <button class="act-btn" id="batchBtn">📋 批量排程</button>
    <button class="act-btn" id="fixedBtn">📚 固定课表</button>
  </div>
  <div id="list"></div>

<!-- 添加 / 编辑任务 -->
<div class="overlay" id="formOverlay">
  <div class="sheet">
    <h2 id="formTitle">添加任务</h2>
    <div class="field">
      <label>任务标题</label>
      <input type="text" id="fTitle" placeholder="例如：背单词" maxlength="60">
    </div>
    <div class="field">
      <label>分类</label>
      <select id="fCategory">
        <option>学习</option><option>课程</option><option>工作</option>
        <option>运动</option><option>生活</option><option>其他</option>
      </select>
    </div>
    <div class="field">
      <label>时长（分钟）</label>
      <input type="number" id="fDuration" value="60" min="5" step="5">
      <div class="chips" style="margin-top:8px;">
        <button type="button" class="chip" data-min="30">30 分钟</button>
        <button type="button" class="chip" data-min="60">1 小时</button>
        <button type="button" class="chip" data-min="90">1.5 小时</button>
        <button type="button" class="chip" data-min="120">2 小时</button>

    <div class="field">

        <label><input type="radio" name="mode" value="auto" checked><span>✨ 自动找空档</span></label>

      </div>

    <div class="field" id="timeField" style="display:none;">

      <input type="time" id="fTime" value="09:00">

</div>

<script>
(function(){
  "use strict";
  var TASKS_KEY = "pink_timetable_tasks_v1";
  var SETTINGS_KEY = "pink_timetable_settings_v1";
  var FIXED_KEY = "pink_timetable_fixed_v1";
  var WEEKDAYS = ["一","二","三","四","五","六","日"];

  function pad(n){ return n < 10 ? "0" + n : "" + n; }
  function toKey(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function parseKey(k){ var p = k.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate() + n); return r; }
  function mondayOf(d){
    var day = d.getDay(); // 0=周日
    var diff = day === 0 ? -6 : 1 - day;
    return addDays(d, diff);
  }
  function toMin(hm){ var p = hm.split(":"); return (+p[0]) * 60 + (+p[1]); }
  function toHM(m){ return pad(Math.floor(m / 60)) + ":" + pad(m % 60); }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  function loadTasks(){
    try { var t = JSON.parse(localStorage.getItem(TASKS_KEY)); return Array.isArray(t) ? t : []; }
    catch(e){ return []; }
  }
  function saveTasks(){ localStorage.setItem(TASKS_KEY, JSON.stringify(tasks)); }
  function loadSettings(){
    try {
      var s = JSON.parse(localStorage.getItem(SETTINGS_KEY));
      if (s && typeof s.start === "number" && typeof s.end === "number") return s;
    } catch(e){}
    return { start: 8 * 60, end: 22 * 60 };
  }
  function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  function loadFixed(){
    try { var f = JSON.parse(localStorage.getItem(FIXED_KEY)); return Array.isArray(f) ? f : []; }
    catch(e){ return []; }
  }
  function saveFixed(){ localStorage.setItem(FIXED_KEY, JSON.stringify(fixedEntries)); }

  var tasks = loadTasks();
  var settings = loadSettings();
  var fixedEntries = loadFixed();
  var today = new Date(); today.setHours(0,0,0,0);
  var viewMonday = mondayOf(today);
  var selectedDate = new Date(today);
  var editingId = null;

  var $ = function(id){ return document.getElementById(id); };

  function weekdayIndex(d){ return (d.getDay() + 6) % 7; }
  function fixedForDate(dateKey){
    var wd = weekdayIndex(parseKey(dateKey));
    return fixedEntries.filter(function(f){ return f.weekday === wd; }).sort(function(a,b){ return a.start - b.start; });
  }
  function busyOn(dateKey, excludeId){
    var list = tasks.filter(function(t){
      return t.date === dateKey && t.start !== null && t.id !== excludeId;
    });
    fixedForDate(dateKey).forEach(function(f){
      if (f.id !== excludeId) list.push({ id: f.id, start: f.start, duration: f.duration });
    });
    return list.sort(function(a,b){ return a.start - b.start; });
  }
  function findFreeSlot(dateKey, duration, excludeId){
    var busy = busyOn(dateKey, excludeId);
    var cand = settings.start;
    for (var i = 0; i < busy.length; i++){
      if (cand + duration <= busy[i].start) return cand;
      cand = Math.max(cand, busy[i].start + busy[i].duration);
    }
    if (cand + duration <= settings.end) return cand;
    return null;
  }
  function hasOverlap(dateKey, start, duration, excludeId){
    return busyOn(dateKey, excludeId).some(function(b){
      return start < b.start + b.duration && start + duration > b.start;
    });
  }

  function render(){
    // 周标签
    var sun = addDays(viewMonday, 6);
    $("weekLabel").textContent =
      (viewMonday.getMonth()+1) + "月" + viewMonday.getDate() + "日 – " +
      (sun.getMonth()+1) + "月" + sun.getDate() + "日";

    // 日期条
    var strip = $("dateStrip"); strip.innerHTML = "";
    var todayKey = toKey(today), selKey = toKey(selectedDate);
    for (var i = 0; i < 7; i++){
      (function(){
        var d = addDays(viewMonday, i), k = toKey(d);
        var el = document.createElement("div");
        el.className = "day" + (k === todayKey ? " today" : "") + (k === selKey ? " sel" : "");
        el.innerHTML = "周" + WEEKDAYS[i] + "<b>" + d.getDate() + "</b>";
        el.addEventListener("click", function(){ selectedDate = d; render(); });
        strip.appendChild(el);
      })();
    }

    // 任务列表
    var list = $("list"); list.innerHTML = "";
    var dayTasks = tasks.filter(function(t){ return t.date === selKey; });
    var scheduled = dayTasks.filter(function(t){ return t.start !== null; }).sort(function(a,b){ return a.start - b.start; });
    var unscheduled = dayTasks.filter(function(t){ return t.start === null; }).sort(function(a,b){ return a.createdAt - b.createdAt; });
    var doneCount = dayTasks.filter(function(t){ return t.done; }).length;
    $("summary").textContent =
      (selectedDate.getMonth()+1) + "月" + selectedDate.getDate() + "日 · 共 " + dayTasks.length + " 项 · 已完成 " + doneCount;

    $("emptyState").style.display = (dayTasks.length === 0 && fixedForDate(selKey).length === 0) ? "block" : "none";

    function sectionHeader(text){
      var h = document.createElement("div");
      h.className = "section-title"; h.textContent = text;
      list.appendChild(h);
    }
    function taskCard(t){
      var card = document.createElement("div");
      card.className = "card";
      var timeTxt = t.start !== null
        ? toHM(t.start) + " – " + toHM(t.start + t.duration)
        : "未排时间 · " + t.duration + " 分钟";
      if (t.start !== null) timeTxt += " · " + t.duration + " 分钟";
      card.innerHTML =
        '<div class="task' + (t.done ? " done" : "") + '">' +
          '<input type="checkbox" class="chk" ' + (t.done ? "checked" : "") + '>' +
          '<div class="t-main"><div class="t-title">' + escapeHtml(t.title) + '</div>' +
          '<div class="t-meta"><span class="cat cat-' + escapeHtml(t.category) + '">' + escapeHtml(t.category) + '</span>' +
          '<span>' + timeTxt + '</span></div></div>' +
          '<div class="t-actions">' +
            '<button class="mini" data-act="edit">编辑</button>' +
            '<button class="mini danger" data-act="del">删除</button>' +
          '</div>' +
        '</div>';
      card.querySelector(".chk").addEventListener("change", function(){
        t.done = this.checked; saveTasks(); render();
      });
      card.querySelector('[data-act="edit"]').addEventListener("click", function(){ openForm(t); });
      card.querySelector('[data-act="del"]').addEventListener("click", function(){
        if (confirm("确定删除「" + t.title + "」吗？")){
          tasks = tasks.filter(function(x){ return x.id !== t.id; });
          saveTasks(); render();
        }
      });
      list.appendChild(card);
    }
    function fixedCard(f){
      var card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        '<div class="task">' +
          '<div class="t-main"><div class="t-title">' + escapeHtml(f.title) + '</div>' +
          '<div class="t-meta"><span class="fixed-badge">固定</span>' +
          '<span class="cat cat-' + escapeHtml(f.category) + '">' + escapeHtml(f.category) + '</span>' +
          '<span>' + toHM(f.start) + ' – ' + toHM(f.start + f.duration) + ' · ' + f.duration + ' 分钟</span></div></div>' +
        '</div>';
      list.appendChild(card);
    }
    var fixedToday = fixedForDate(selKey);
    if (fixedToday.length){ sectionHeader("固定安排"); fixedToday.forEach(fixedCard); }
    if (scheduled.length && unscheduled.length) sectionHeader("已排时间");
    scheduled.forEach(taskCard);
    if (scheduled.length && unscheduled.length) sectionHeader("未排时间");
    unscheduled.forEach(taskCard);
  }

  // 表单
  function openForm(t){
    editingId = t ? t.id : null;
    $("formTitle").textContent = t ? "编辑任务" : "添加任务";
    $("fTitle").value = t ? t.title : "";
    $("fCategory").value = t ? t.category : "学习";
    $("fDuration").value = t ? t.duration : 60;
    if (t && t.start !== null){
      document.querySelector('input[name="mode"][value="manual"]').checked = true;
      $("fTime").value = toHM(t.start);
    } else {
      document.querySelector('input[name="mode"][value="auto"]').checked = true;
      $("fTime").value = "09:00";
    }
    syncModeUI();
    $("formErr").style.display = "none";
    $("formOverlay").classList.add("open");
    setTimeout(function(){ $("fTitle").focus(); }, 50);
  }
  function syncModeUI(){
    var mode = document.querySelector('input[name="mode"]:checked').value;
    $("timeField").style.display = mode === "manual" ? "block" : "none";
    $("autoHint").style.display = mode === "auto" ? "block" : "none";
  }
  function closeForm(){ $("formOverlay").classList.remove("open"); }

  document.querySelectorAll('input[name="mode"]').forEach(function(r){
    r.addEventListener("change", syncModeUI);
  });
  document.querySelectorAll(".chip[data-min]").forEach(function(c){
    c.addEventListener("click", function(){ $("fDuration").value = c.getAttribute("data-min"); });
  });
  $("addBtn").addEventListener("click", function(){ openForm(null); });
  $("cancelBtn").addEventListener("click", closeForm);
  $("formOverlay").addEventListener("click", function(e){
    if (e.target === this) closeForm();
  });
  $("saveBtn").addEventListener("click", function(){
    var err = $("formErr");
    var title = $("fTitle").value.trim();
    var duration = parseInt($("fDuration").value, 10);
    if (!title){ err.textContent = "请填写任务标题"; err.style.display = "block"; return; }
    if (!duration || duration < 5){ err.textContent = "时长至少 5 分钟"; err.style.display = "block"; return; }
    var dateKey = toKey(selectedDate);
    var mode = document.querySelector('input[name="mode"]:checked').value;
    var start = null;
    if (mode === "auto"){
      start = findFreeSlot(dateKey, duration, editingId);
      if (start === null){
        err.textContent = "今天没有合适的空档了，试试缩短时长、换个日期，或者先在排程设置里放宽时间范围。";
        err.style.display = "block"; return;
      }
    } else {
      start = toMin($("fTime").value || "09:00");
      if (start + duration > settings.end || start < settings.start){
        err.textContent = "指定时间超出排程边界（" + toHM(settings.start) + " – " + toHM(settings.end) + "），请调整时间或先改排程设置。";
        err.style.display = "block"; return;
      }
      if (hasOverlap(dateKey, start, duration, editingId)){
        err.textContent = "这个时间段和已有任务重叠了，换个时间吧。";
        err.style.display = "block"; return;
      }
    }
    if (editingId){
      var t = tasks.find(function(x){ return x.id === editingId; });
      if (t){
        t.title = title; t.category = $("fCategory").value;
        t.duration = duration; t.start = start;
      }
    } else {
      tasks.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
        title: title, category: $("fCategory").value, duration: duration,
        date: dateKey, start: start, done: false, createdAt: Date.now()
      });
    }
    saveTasks(); closeForm(); render();
  });

  // 设置
  $("settingsBtn").addEventListener("click", function(){
    $("sStart").value = toHM(settings.start);
    $("sEnd").value = toHM(settings.end);
    $("settingsOverlay").classList.add("open");
  });
  $("closeSettingsBtn").addEventListener("click", function(){
    $("settingsOverlay").classList.remove("open");
  });
  $("settingsOverlay").addEventListener("click", function(e){
    if (e.target === this) $("settingsOverlay").classList.remove("open");
  });
  $("saveSettingsBtn").addEventListener("click", function(){
    var s = toMin($("sStart").value), e = toMin($("sEnd").value);
    if (e <= s){ alert("最晚时间要晚于最早时间"); return; }
    settings = { start: s, end: e };
    saveSettings();
    $("settingsOverlay").classList.remove("open");
    render();
  });

  // 周导航
  $("prevWeek").addEventListener("click", function(){
    viewMonday = addDays(viewMonday, -7); render();
  });
  $("nextWeek").addEventListener("click", function(){
    viewMonday = addDays(viewMonday, 7); render();
  });
  $("todayBtn").addEventListener("click", function(){
    viewMonday = mondayOf(new Date());
    selectedDate = new Date(); selectedDate.setHours(0,0,0,0);
    render();
  });

  // 批量自动排程
  function parseBatchLine(raw){
    var line = raw.trim();
    if (!line) return null;
    if (/^\d+(?:\.\d+)?\s*(小时|时|h|分钟|分|min)?$/.test(line)){
      return { error: "这一行只有时长，没有任务名：" + line };
    }
    var title = line, duration = 30;
    var m = line.match(/^(.*?)(\d+(?:\.\d+)?)\s*(小时|时|h|分钟|分|min)\s*$/);
    if (m){
      title = m[1].trim();
      var v = parseFloat(m[2]);
      duration = (m[3] === "小时" || m[3] === "时" || m[3] === "h") ? Math.round(v * 60) : Math.round(v);
    } else {
      var m2 = line.match(/^(.*?)\s+(\d+(?:\.\d+)?)\s*$/);
      if (m2){ title = m2[1].trim(); duration = Math.round(parseFloat(m2[2])); }
    }
    if (!title) return { error: "这一行只有时长，没有任务名：" + line };
    if (duration < 5) return { error: "「" + title + "」时长太短（至少 5 分钟）" };
    return { title: title, duration: duration };
  }
  function openBatch(){
    $("batchInput").style.display = "block";
    $("batchResult").style.display = "none";
    $("batchResult").innerHTML = "";
    $("batchErr").style.display = "none";
    $("bText").value = "";
    $("batchDateLabel").textContent = (selectedDate.getMonth()+1) + "月" + selectedDate.getDate() + "日";
    $("batchOverlay").classList.add("open");
    setTimeout(function(){ $("bText").focus(); }, 50);
  }
  function closeBatch(){ $("batchOverlay").classList.remove("open"); }
  $("batchBtn").addEventListener("click", openBatch);
  $("cancelBatchBtn").addEventListener("click", closeBatch);
  $("batchOverlay").addEventListener("click", function(e){
    if (e.target === this) closeBatch();
  });
  $("runBatchBtn").addEventListener("click", function(){
    var err = $("batchErr");
    var lines = $("bText").value.split("\n");
    var items = [], lineErrors = [];
    for (var i = 0; i < lines.length; i++){
      var p = parseBatchLine(lines[i]);
      if (p === null) continue;
      if (p.error){ lineErrors.push(p.error); }
      else items.push(p);
    }
    if (items.length === 0){
      err.textContent = lineErrors.length ? lineErrors[0] : "请先输入要做的事，一行一件。";
      err.style.display = "block"; return;
    }
    var dateKey = toKey(selectedDate);
    var category = $("bCategory").value;
    var okList = [], failList = lineErrors.slice();
    for (var j = 0; j < items.length; j++){
      var slot = findFreeSlot(dateKey, items[j].duration, null);
      if (slot === null){
        failList.push("「" + items[j].title + "」没排上：当天排满了，没有合适的空档。");
        continue;
      }
      tasks.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 7) + "_" + j,
        title: items[j].title, category: category, duration: items[j].duration,
        date: dateKey, start: slot, done: false, createdAt: Date.now() + j
      });
      okList.push({ title: items[j].title, start: slot, duration: items[j].duration });
    }
    saveTasks(); render();
    var dateTxt = (selectedDate.getMonth()+1) + "月" + selectedDate.getDate() + "日";
    var html = "<h3>排程结果 · " + escapeHtml(dateTxt) + "</h3>";
    if (okList.length){
      html += "<div class=\"batch-item ok\">✅ 排上了 " + okList.length + " 项</div>";
      okList.forEach(function(o){
        html += "<div class=\"batch-item ok\">" + escapeHtml(o.title) + " · " + toHM(o.start) + " – " + toHM(o.start + o.duration) + "</div>";
      });
    }
    if (failList.length){
      html += "<div class=\"batch-item fail\">❌ 没排上 " + failList.length + " 项</div>";
      failList.forEach(function(f){
        html += "<div class=\"batch-item fail\">" + escapeHtml(f) + "</div>";
      });
    }
    html += "<button class=\"btn-primary\" id=\"batchDoneBtn\" style=\"margin-top:12px;\">完成</button>";
    $("batchInput").style.display = "none";
    var res = $("batchResult");
    res.innerHTML = html;
    res.style.display = "block";
    $("batchDoneBtn").addEventListener("click", closeBatch);
  });

  // 固定课表
  function renderFixedList(){
    var box = $("fixedList");
    box.innerHTML = "";
    if (!fixedEntries.length){
      box.innerHTML = '<p class="hint">还没有固定安排，上面添加一条吧。</p>';
      return;
    }
    var sorted = fixedEntries.slice().sort(function(a,b){
      return a.weekday - b.weekday || a.start - b.start;
    });
    sorted.forEach(function(f){
      var row = document.createElement("div");
      row.className = "fixed-row";
      row.innerHTML =
        '<div class="fx-main"><div>' + escapeHtml(f.title) + '</div>' +
        '<div class="fx-time">每周' + WEEKDAYS[f.weekday] + ' · ' + toHM(f.start) + ' – ' + toHM(f.start + f.duration) + ' · ' + f.duration + ' 分钟 · ' + escapeHtml(f.category) + '</div></div>' +
        '<button class="mini danger" data-act="del-fixed">删除</button>';
      row.querySelector('[data-act="del-fixed"]').addEventListener("click", function(){
        if (confirm("确定删除固定安排「" + f.title + "」吗？")){
          fixedEntries = fixedEntries.filter(function(x){ return x.id !== f.id; });
          saveFixed(); renderFixedList(); render();
        }
      });
      box.appendChild(row);
    });
  }
  function openFixed(){
    $("fixedErr").style.display = "none";
    $("fxTitle").value = "";
    renderFixedList();
    $("fixedOverlay").classList.add("open");
  }
  function closeFixed(){ $("fixedOverlay").classList.remove("open"); }
  $("fixedBtn").addEventListener("click", openFixed);
  $("closeFixedBtn").addEventListener("click", closeFixed);
  $("fixedOverlay").addEventListener("click", function(e){
    if (e.target === this) closeFixed();
  });
  $("addFixedBtn").addEventListener("click", function(){
    var err = $("fixedErr");
    var title = $("fxTitle").value.trim();
    var duration = parseInt($("fxDuration").value, 10);
    if (!title){ err.textContent = "请填写名称"; err.style.display = "block"; return; }
    if (!duration || duration < 5){ err.textContent = "时长至少 5 分钟"; err.style.display = "block"; return; }
    var weekday = parseInt($("fxWeekday").value, 10);
    var start = toMin($("fxTime").value || "08:00");
    var overlap = fixedEntries.some(function(f){
      return f.weekday === weekday && start < f.start + f.duration && start + duration > f.start;
    });
    if (overlap){
      err.textContent = "和已有的固定安排时间重叠了，换个时间吧。";
      err.style.display = "block"; return;
    }
    fixedEntries.push({
      id: "fx_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7),
      title: title, weekday: weekday, start: start, duration: duration,
      category: $("fxCategory").value
    });
    saveFixed(); renderFixedList(); render();
    $("fxTitle").value = "";
    err.style.display = "none";
  });

  render();
})();
</script>
</body>
</html>
